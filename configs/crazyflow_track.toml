# Everything specific to the crazyflow_position experiment.
# Algorithm defaults live in chronosrl/algorithms/<name>.py; this file only overrides them.
# CLI flags still win, e.g. --environment.spawn.max_speed=0.5
# Write floats with a decimal point: ConfigDict locks the type from the first value.


[runner]
exp_name = "crazyflow_track"
checkpoint_every = 10 # keep checkpoints/epoch_<N>.pkl every N epochs (0: only the latest model.pkl)
tag = ""

# Applied to every algorithm
[algorithm]
action_chunk_length = 1
cost_weight = 0.0
goal_sequence_length = 10
name = "srl"
window = 1000
total_timesteps = 50_000_000

# Per-algorithm overrides go in subtables, applied only for that --algorithm.name
# [algorithm.crl]
# embedding_layer_norm = true

[environment]
name = "crazyflow_track"
seed = 1000
nr_envs = 512
nr_eval_envs = 100
episode_length = 500
freq = 50
sim_freq = 500
device = "gpu"
drone = "cf21B_500"
dynamics = "first_principles"
reset_rotor = true

[environment.randomization]
enabled = false
mass = 0.2          # fraction, half of the experiments default 0.2
thrust_curve = 0.1 # fraction, half of 0.1
action_delay = 0.04 # s, max lag (half of 0.04)
inertia = 0.2         # fraction per principal axis
rotor_dynamics = 0.2  # fraction per motor and coefficient
torque_curve = 0.1    # fraction per motor and coefficient
force = 0.04          # N per axis, constant per episode (~10 % of hover thrust)
torque = 0.0002       # Nm per axis, constant per episode
force_noise = 0.05    # N std per sim step
torque_noise = 0.001  # Nm std per sim step


[environment.action]
max_angle = 0.5236 # rad, limit for roll/pitch/yaw commands
zero_yaw = true # hold the yaw command at 0, the policy outputs [roll, pitch, thrust]
delta = true # the policy outputs a change to the last action
max_delta = 0.2 # max change per policy step, in [-1, 1] action units

[environment.task]
goal_radius = 0.05 # training and relabeling
eval_goal_radius = 0.1 # eval and rollout only
nr_waypoints = 4

# Episodes terminate when the drone leaves this box
[environment.bounds]
low = [-4.0, -4.0, 0.0]
high = [4.0, 4.0, 4.0]

[environment.spawn]
low = [-1.5, 0.75, 0.01]
high = [-1.5, 0.75, 0.01]
max_speed = 0.0

[environment.goal]
# One row per waypoint, in the order they must be reached; must have nr_waypoints rows
nominal = [[0.5 , 0.25, 0.7], [1.05, 0.75, 1.2], [-1.0, -0.25, 0.7], [0.0, -0.75, 1.2]]
std = [0.15, 0.15, 0.0]   # m per axis, shared by all waypoints (or a (K, 3) list for per-waypoint std)
clip = 2.0               # truncate at ±clip std

