# Everything specific to the crazyflow_position experiment.
# Algorithm defaults live in chronosrl/algorithms/<name>.py; this file only overrides them.
# CLI flags still win, e.g. --environment.spawn.max_speed=0.5
# Write floats with a decimal point: ConfigDict locks the type from the first value.


[runner]
exp_name = "crazyflow_position"
checkpoint_every = 20 # keep checkpoints/epoch_<N>.pkl every N epochs (0: only the latest model.pkl)

# Applied to every algorithm
[algorithm]
action_chunk_length = 1
cost_weight = 0.0
goal_sequence_length = 32
name = "srl"
window = 1000

# Per-algorithm overrides go in subtables, applied only for that --algorithm.name
# [algorithm.crl]
# embedding_layer_norm = true

[environment]
name = "crazyflow_position"
seed = 1000
nr_envs = 512
nr_eval_envs = 100
episode_length = 1000 # 1000 policy steps at 50 Hz = 20-second episodes
freq = 50
sim_freq = 500
device = "gpu"
drone = "cf21B_500"
dynamics = "first_principles"
reset_rotor = true

[environment.randomization]
enabled = true
mass = 0.2            # fraction
inertia = 0.2         # fraction per principal axis
rotor_dynamics = 0.2  # fraction per motor and coefficient
thrust_curve = 0.1    # fraction per motor and coefficient
torque_curve = 0.1    # fraction per motor and coefficient
force = 0.04          # N per axis, constant per episode (~10 % of hover thrust)
torque = 0.0002       # Nm per axis, constant per episode
force_noise = 0.05    # N std per sim step
torque_noise = 0.001  # Nm std per sim step
action_delay = 0.04   # s, max lag of the attitude command


[environment.action]
max_angle = 0.5236 # rad, limit for roll/pitch/yaw commands

[environment.task]
goal_radius = 0.05
rest_speed = 0.05

# Episodes terminate when the drone leaves this box
[environment.bounds]
low = [-4.0, -4.0, 0.0]
high = [4.0, 4.0, 4.0]

[environment.spawn]
low = [-1.0, -1.0, 0.5]
high = [1.0, 1.0, 1.5]
max_speed = 1.0

[environment.goal]
low = [-1.0, -1.0, 0.5]
high = [1.0, 1.0, 1.5]
