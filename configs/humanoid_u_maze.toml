# JaxGCRL humanoid_u_maze with the settings of the ChronoSRL paper.
# Algorithm defaults live in chronosrl/algorithms/<name>.py; this file only overrides them.
# CLI flags still win, e.g. --algorithm.name=srl --algorithm.depth=8 --environment.seed=1001

[runner]
exp_name = "humanoid_u_maze"

[algorithm]
name = "chronosrl"

# Humanoid tasks: goal sequences and larger batches for the survival critics
[algorithm.chronosrl]
goal_sequence_length = 32
batch_size = 1024

[algorithm.srl]
goal_sequence_length = 32
batch_size = 1024

[environment]
name = "humanoid_u_maze"
seed = 1000
nr_envs = 512
nr_eval_envs = 100
episode_length = 1000
