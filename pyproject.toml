[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "chronosrl"
version = "0.0.1"
description = "ChronoSRL: Temporal Geometry for Self-Supervised Reinforcement Learning"
authors = [{name = "Nico Bohlinger", email = "nico.bohlinger@gmail.com"}]
license = {text = "MIT License"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "absl-py",
    "ml-collections",
    "wandb",
]

[project.optional-dependencies]
benchmark = [
    "jax==0.4.23",
    "jaxlib==0.4.23",
    "flax==0.7.4",
    "optax==0.2.2",
    "chex==0.1.86",
    "orbax-checkpoint==0.5.16",
    "brax==0.10.1",
    "mujoco==3.2.6",
    "mujoco-mjx==3.2.6",
    "numpy==1.26.4",
    "scipy==1.12.0",
]
go2 = [
    "jax==0.7.2",
    "jaxlib==0.7.2",
    "flax==0.12.0",
    "optax==0.2.8",
    "chex==0.1.92",
    "mujoco==3.7.0",
    "mujoco-mjx==3.7.0",
    "mujoco-warp==3.7.0.1",
    "warp-lang==1.12.1",
    "dm_control>=1.0.39",
    "numpy==2.4.6",
    "scipy==1.17.1",
]

[tool.setuptools.packages.find]
include = ["chronosrl*"]

[tool.setuptools.package-data]
"*" = ["*.xml", "assets/*.xml", "LICENSE"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
chronosrl = { path = ".", editable = true }

[tool.pixi.environments]
benchmark = { features = ["benchmark"] }
go2 = { features = ["go2"] }

[tool.pixi.feature.benchmark.dependencies]
python = "3.10.*"

[tool.pixi.feature.benchmark.activation.env]
# Prefer the environment's CUDA assembler over the system CUDA installation.
PATH = "$CONDA_PREFIX/lib/python3.10/site-packages/nvidia/cuda_nvcc/bin:$PATH"

[tool.pixi.feature.benchmark.pypi-dependencies]
# Declare the legacy CUDA extra explicitly to avoid extra-name normalization issues.
jax = "==0.4.23"
jaxlib = "==0.4.23+cuda12.cudnn89"
nvidia-cublas-cu12 = ">=12.2.5.6"
nvidia-cuda-cupti-cu12 = ">=12.2.142"
nvidia-cuda-nvcc-cu12 = ">=12.2.140"
nvidia-cuda-runtime-cu12 = ">=12.2.140"
nvidia-cudnn-cu12 = "==8.9.7.29"
nvidia-cufft-cu12 = ">=11.0.8.103"
nvidia-cusolver-cu12 = ">=11.5.2"
nvidia-cusparse-cu12 = ">=12.1.2.141"
nvidia-nccl-cu12 = ">=2.18.3"
nvidia-nvjitlink-cu12 = ">=12.2"

[tool.pixi.feature.benchmark.pypi-options]
index-url = "https://pypi.org/simple"
find-links = [
    { url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html" },
]

[tool.pixi.feature.go2.dependencies]
python = "3.11.*"

[tool.pixi.feature.go2.pypi-dependencies]
jax = { version = "==0.7.2", extras = ["cuda12"] }
